name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps || npm install

      - name: Build application
        run: npm run build

      - name: Prepare SPA routing & static assets for GitHub Pages
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Publish build to gh-pages branch
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Deploy ASSA Informatika CBT to GitHub Pages"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Check or Auto-Enable GitHub Pages
        id: pages_status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            BUILD_TYPE=$(gh api "repos/${{ github.repository }}/pages" --jq '.build_type // "legacy"')
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "build_type=$BUILD_TYPE" >> "$GITHUB_OUTPUT"
          else
            if gh api -X POST "repos/${{ github.repository }}/pages" -f "source[branch]=gh-pages" -f "source[path]=/" >/dev/null 2>&1; then
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              echo "build_type=legacy" >> "$GITHUB_OUTPUT"
            elif gh api -X POST "repos/${{ github.repository }}/pages" -f "build_type=workflow" >/dev/null 2>&1; then
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              echo "build_type=workflow" >> "$GITHUB_OUTPUT"
            else
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "build_type=none" >> "$GITHUB_OUTPUT"
              echo "### Build Berhasil Disiapkan ke Branch \`gh-pages\`" >> "$GITHUB_STEP_SUMMARY"
              echo "Jika halaman belum aktif, buka **Settings -> Pages** di repositori GitHub Anda:" >> "$GITHUB_STEP_SUMMARY"
              echo "1. Pilih **Source**: \`Deploy from a branch\` lalu pilih branch **\`gh-pages\`** / **\`(root)\`** dan klik **Save**, ATAU" >> "$GITHUB_STEP_SUMMARY"
              echo "2. Pilih **Source**: \`GitHub Actions\`." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Upload build artifact (GitHub Actions mode)
        if: steps.pages_status.outputs.build_type == 'workflow'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages (GitHub Actions mode)
        if: steps.pages_status.outputs.build_type == 'workflow'
        id: deployment
        uses: actions/deploy-pages@v4
